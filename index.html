<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>トーク・デリバリー -オンライン会議の発言支援アプリ-</title>
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="icon" href="images/Talk Takkyubun.png">
    </head>

    <body>
        <!--ハンバーガーメニューの実装-->
        <header class="header">
            <div class="header_container">
                <img src="images/Talk Takkyubun.png" class="header_image">
                <h1 class="header_container">トーク・デリバリー -オンライン会議の発言支援アプリ-</h1>
                <!-- ハンバーガーボタンの実装 -->
                <!-- <button type="button" class="hamburger"> -->
                    <!-- <span></span> ハンバーガーボタンの線の実装 -->
                <!-- </button> -->
                <!--メニューの追加-->
                <!-- <nav class="nav"> -->
                    <!-- <ul class="nav_list"> -->
                        <!-- <li class="nav_item">マイクオン/オフ</li> -->
                        <!-- <li class="nav_item">カメラオン/オフ</li> -->
                        <!-- <li class="nav_item">呼びかけ設定</li> -->
                    <!-- </ul> -->
                <!-- </nav> -->
            </div>
        </header>
    <div class="main">
        <!--親ブロックの設定（container）-->
            <div class="main-container">
                <!--左画面-->
                <div class="left">
                    <!--読み上げ機能設定-->
                    <label class="switchLabel">
                        <input type="checkbox" id="readToggle">
                        <span class="slider"></span>
                    </label>
                    <span id="toggleLabel">発言内容の音声読み上げ OFF</span>
                    <!--発言入力画面-->
                    <div class="Contribution">
                        <textarea id="Chat" name="Chatinput" placeholder="ここにテキストを入力し、Shiftキー+Enterキーを同時に押すとテキストが削除"></textarea>
                    </div>
                    <!--読み上げテキスト表示領域-->
                    <!-- <div id="displayArea"></div> -->
                </div>
        
                <!--右画面-->
                <div class="right">
                    <!--カメラ起動-->
                    <div class="Camera">
                        <video id="video" playsinline></video>
                    </div>        
                    <!-- <div>
                        <div id="ModeDisplay">通知音モード</div>
                    </div> -->
                    <!--呼びかけモードの設定-->
                    <label id="CallingTitle">呼びかけモードの設定</label>
                    <select id="CallingType">
                        <option value="ModeDisplay">通知音モード</option>
                        <option value="TextDisplay">今いいですか？モード</option>
                        <!-- <option value="BlinkMode">点滅モード</option> -->
                    </select>
                    <!--呼びかけボタンの実装-->
                    <div id="ControlContainer">
                        <button id="Calling">呼びかけ</button>

                    <!-- <label class="switch" id="SoundToggleLabel">
                        <input type="checkbox" id="SoundToggle">
                        <span class="slider"></span>
                    </label> -->
                    </div>
                </div>
            </div>
             <div class="container">
                <!-- <div>
                    <label id="LogTitle">発言ログエリア</label>
                </div> -->
                <!--発言ログ表示領域 & 読み上げテキスト表示領域-->
                <div class="log-section" id="logArea"></div>
            </div>
    </div>

        <script src="main.js"></script>
        <script src="scale-manager.js"></script>
    </body>
</html>
